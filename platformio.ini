; bay-fish-forecast (钓鱼海况屏) — fishing conditions display for M5Stack Tab5 (docs/PRD.md)
[platformio]
default_envs = board_Tab5

[env:board_Tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags =
  -std=gnu++2a
  -D M5GFX_BOARD=board_M5Tab5
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -I include
lib_deps =
  m5stack/M5Unified
  m5stack/M5GFX
  bblanchon/ArduinoJson@^7

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I include -D NATIVE_TEST
lib_deps = bblanchon/ArduinoJson@^7

; Over-the-air update on the LAN (PRD §10.9): pio run -e ota -t upload --upload-port <tab5-ip>
; The password comes from $BAY_FISH_OTA_PASSWORD or OTA_PASSWORD in include/secrets.h (never committed).
[env:ota]
extends = env:board_Tab5
upload_protocol = espota
extra_scripts = post:tools/ota_auth.py
